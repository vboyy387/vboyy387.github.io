
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>YouTube</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

#start {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    background: black;
    color: white;
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
}

#iframe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: none;
}
</style>
</head>

<body>

<button id="start">
    PRESS ANYWHERE TO ENTER FULLSCREEN
</button>

<iframe id="iframe" src="youtube.com"></iframe>

<script>
const start = document.getElementById("start");
const frame = document.getElementById("iframe");

async function enterFullscreen() {
    try {
        await document.documentElement.requestFullscreen();
    } catch (e) {
        console.log("Fullscreen error:", e);
    }

    if (document.fullscreenElement) {
        start.style.display = "none";
        frame.style.display = "block";
    }
}

start.addEventListener("click", enterFullscreen);

document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement) {
        frame.style.display = "none";
        start.style.display = "flex";
    } else {
        frame.style.display = "block";
        start.style.display = "none";
    }
});
</script>

</body>
</html>
